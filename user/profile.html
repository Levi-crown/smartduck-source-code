<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>SmartDuck Profile</title>
    <meta
      name="description"
      content="SmartDuck user profile page for account, incubator, and preference details."
    />
    <script src="../auth-guard.js?v=smartduck-20260804-auth-history-v2" data-role="user"></script>
    <link rel="stylesheet" href="../styles.css?v=smartduck-20260911-history-scroll-v24" />
    <link rel="stylesheet" href="../mobile.css?v=smartduck-20260911-history-scroll-v20" />
  </head>
  <body data-page="profile" class="user-dashboard-page user-profile-page">
    <div id="dashboard-container" class="dashboard-container">
      <header class="mobile-topbar">
        <button
          id="mobile-menu-button"
          class="mobile-topbar__button"
          type="button"
          aria-label="Open navigation"
          aria-expanded="false"
          aria-controls="app-sidebar"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="mobile-topbar__brand">
          <span class="mobile-topbar__title">SmartDuck</span>
          <span id="mobile-page-label" class="mobile-topbar__subtitle">Profile</span>
        </div>
      </header>

      <div class="app-shell">
        <aside id="app-sidebar" class="sidebar" aria-label="Sidebar navigation">
          <div id="sidebar-content" class="sidebar__content"></div>
        </aside>

        <button
          id="sidebar-backdrop"
          class="sidebar-backdrop"
          type="button"
          aria-label="Close navigation"
          tabindex="-1"
        ></button>

        <main class="main-content" aria-live="polite">
          <div id="page-root" class="page-root">
            <header class="page-header page-header--dashboard">
              <div>
                <h2 class="page-title">Profile</h2>
                <p class="page-subtitle">View and update your account information.</p>
              </div>
              <div class="dashboard-toolbar">
                <button
                  type="button"
                  class="dashboard-alert-button"
                  aria-label="Open notifications"
                  data-ui-action="Open notifications"
                >
                  <span class="dashboard-alert-button__icon" data-icon="bell"></span>
                  <span class="dashboard-alert-button__badge" hidden aria-hidden="true">0</span>
                </button>
                <div class="dashboard-userbox">
                  <div id="profile-user-avatar" class="dashboard-userbox__avatar">SD</div>
                  <div class="dashboard-userbox__meta">
                    <p id="profile-user-name" class="dashboard-userbox__name">SmartDuck User</p>
                    <p id="profile-user-role" class="dashboard-userbox__role">System User</p>
                  </div>
                </div>
              </div>
            </header>

            <div class="page-stack profile-layout profile-layout--top-trigger-only" aria-hidden="true"></div>
          </div>
        </main>
      </div>

      <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
      <div id="chart-tooltip" class="chart-tooltip" hidden></div>
    </div>
    <script type="module" src="../script.js?v=smartduck-20261022-live-poll-v66"></script>
    <script src="../mobile-shell.js?v=smartduck-20260816-mobile-v5" defer></script>
  </body>
</html>
